<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寫作工作室</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f0e8; --surface: #fffdf7; --border: #d9d0bc;
    --accent: #4a3728; --accent2: #8b6e52;
    --text: #2c2017; --muted: #9e8f7e;
    --danger: #c0392b; --ok: #27ae60;
    --font-sans: "Noto Sans TC", "PingFang TC", sans-serif;
    --font-serif: "Noto Serif TC", "Georgia", serif;
  }
  body { font-family: var(--font-sans); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Header ── */
  header {
    height: 52px; background: var(--accent); color: #f5f0e8;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
  }
  .logo { font-weight: 700; font-size: 1rem; letter-spacing: .04em; }
  .logo small { opacity: .6; font-weight: 400; font-size: .8rem; margin-left: 6px; }
  .hright { display: flex; align-items: center; gap: 10px; }
  .badge {
    font-size: .72rem; padding: 2px 8px; border-radius: 20px;
    display: flex; align-items: center; gap: 4px;
  }
  .badge.ok  { background: rgba(39,174,96,.25); color: #5dbd80; }
  .badge.ing { background: rgba(230,170,50,.25); color: #e6a832; }
  .badge.off { background: rgba(200,200,200,.2); color: #aaa; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .dot.pulse { animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.25} }

  .avatar { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.4); }
  .uname { font-size: .82rem; }
  button {
    font-family: inherit; cursor: pointer; border: none;
    border-radius: 6px; padding: 5px 12px; font-size: .82rem; transition: all .15s;
  }
  .btn-ghost { background: transparent; color: #f5f0e8; border: 1px solid rgba(255,255,255,.35); }
  .btn-ghost:hover { background: rgba(255,255,255,.1); }
  .btn-red { background: var(--danger); color: #fff; font-weight: 600; }
  .btn-red:hover { filter: brightness(1.1); }

  /* ── Layout ── */
  .body { display: flex; flex: 1; overflow: hidden; }

  /* ── Sidebar ── */
  aside {
    width: 220px; flex-shrink: 0; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sb-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; border-bottom: 1px solid var(--border);
  }
  .sb-head span { font-size: .78rem; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
  #btn-new {
    width: 26px; height: 26px; background: var(--accent); color: #fff;
    font-size: 1.1rem; border-radius: 6px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #btn-new:hover { filter: brightness(1.2); }
  #list { flex: 1; overflow-y: auto; padding: 6px; }
  .ni {
    padding: 9px 10px; border-radius: 7px; cursor: pointer;
    margin-bottom: 3px; border: 2px solid transparent; transition: all .12s;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 4px;
  }
  .ni:hover { background: var(--bg); }
  .ni.active { background: var(--bg); border-color: var(--accent2); }
  .ni-info { flex: 1; min-width: 0; }
  .ni-title { font-size: .84rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ni-date  { font-size: .7rem; color: var(--muted); margin-top: 2px; }
  .ni-del { opacity: 0; background: none; color: var(--danger); padding: 1px 4px; font-size: .9rem; flex-shrink: 0; }
  .ni:hover .ni-del { opacity: 1; }

  /* ── Main ── */
  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    color: var(--muted); font-size: .9rem;
  }
  .empty .icon { font-size: 3rem; opacity: .35; }

  /* ── Editor panel ── */
  #panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 9px 18px; border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  #t-title {
    flex: 1; min-width: 120px; border: none; outline: none;
    font-size: .98rem; font-weight: 700; font-family: inherit;
    background: transparent; color: var(--text);
  }
  #t-title::placeholder { color: var(--muted); }
  .sep { width: 1px; height: 20px; background: var(--border); }
  select {
    border: 1px solid var(--border); border-radius: 5px;
    padding: 3px 7px; font-size: .8rem; font-family: inherit;
    background: var(--bg); color: var(--text); cursor: pointer;
  }
  #editor {
    flex: 1; padding: 24px 32px; overflow-y: auto;
    font-size: 1rem; line-height: 1.9; outline: none;
    caret-color: var(--accent); background: var(--surface);
  }
  #editor:empty::before { content: "開始輸入筆記內容..."; color: var(--muted); pointer-events: none; }
  .statusbar {
    padding: 4px 18px; font-size: .72rem; color: var(--muted);
    background: var(--bg); border-top: 1px solid var(--border);
    display: flex; gap: 14px;
  }

  /* ── Login overlay ── */
  #login {
    position: fixed; inset: 0; z-index: 500;
    background: var(--bg); display: flex;
    align-items: center; justify-content: center;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 44px 44px 36px;
    max-width: 360px; width: 90%; text-align: center;
    box-shadow: 0 4px 24px rgba(74,55,40,.12);
  }
  .card .icon { font-size: 2.8rem; margin-bottom: 10px; }
  .card h1 { font-size: 1.3rem; color: var(--accent); margin-bottom: 6px; }
  .card p  { font-size: .87rem; color: var(--muted); line-height: 1.6; margin-bottom: 26px; }
  .btn-google {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    width: 100%; padding: 11px; border-radius: 8px;
    border: 1.5px solid var(--border); background: var(--surface);
    font-size: .92rem; font-weight: 600; color: var(--text);
  }
  .btn-google:hover { background: var(--bg); }
  .btn-google svg { width: 19px; height: 19px; }
</style>
</head>
<body>

<!-- 登入畫面 -->
<div id="login">
  <div class="card">
    <div class="icon">✦</div>
    <h1>寫作工作室</h1>
    <p>登入後筆記自動同步雲端，<br>任何裝置都能繼續創作。</p>
    <button class="btn-google" id="btn-login">
      <svg viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.8 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.1 17.8 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.9 7.2l7.6 5.9c4.4-4.1 7.1-10.1 7.1-17.1z"/>
        <path fill="#FBBC05" d="M10.5 28.6A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.9-6.1z"/>
        <path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.6-5.9c-2 1.4-4.7 2.2-7.6 2.2-6.2 0-11.5-4.2-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/>
      </svg>
      使用 Google 帳號登入
    </button>
  </div>
</div>

<!-- 主介面 -->
<header>
  <div class="logo">寫作工作室 <small>雲端同步版</small></div>
  <div class="hright">
    <div class="badge off" id="badge"><div class="dot"></div><span>未連線</span></div>
    <img class="avatar" id="avatar" src="" alt="" style="display:none">
    <span class="uname" id="uname" style="display:none"></span>
    <button class="btn-ghost" id="btn-logout" style="display:none">登出</button>
  </div>
</header>

<div class="body">
  <aside>
    <div class="sb-head">
      <span>筆記列表</span>
      <button id="btn-new">＋</button>
    </div>
    <div id="list"></div>
  </aside>

  <main>
    <div class="empty" id="empty">
      <div class="icon">✦</div>
      <span>點擊「＋」建立第一則筆記</span>
    </div>

    <div id="panel" style="display:none">
      <div class="toolbar">
        <input id="t-title" type="text" placeholder="筆記標題..." maxlength="60">
        <div class="sep"></div>
        <select id="t-font">
          <option value="var(--font-sans)">黑體</option>
          <option value="var(--font-serif)">宋體</option>
        </select>
        <select id="t-size">
          <option value=".9rem">小</option>
          <option value="1rem" selected>中</option>
          <option value="1.2rem">大</option>
          <option value="1.5rem">特大</option>
        </select>
        <button class="btn-red" id="btn-del" style="margin-left:auto">刪除</button>
      </div>
      <div id="editor" contenteditable="true" spellcheck="false"></div>
      <div class="statusbar">
        <span id="s-chars">0 字</span>
        <span id="s-paras">0 段落</span>
        <span id="s-sync">─</span>
      </div>
    </div>
  </main>
</div>

<script>
// ═══════════════════════════════════════════
//  Supabase 設定
// ═══════════════════════════════════════════
const SB_URL = 'https://cxaaydhcrrlwfhpsylfr.supabase.co';
const SB_KEY = 'sb_publishable_wowWxuYTrvWRlayPcAcbVQ_2peC_l6s';

const sb = supabase.createClient(SB_URL, SB_KEY);

// ═══════════════════════════════════════════
//  狀態
// ═══════════════════════════════════════════
let user    = null;
let noteId  = null;
let notes   = {};
let timer   = null;
let channel = null;
let remote  = false;

// ═══════════════════════════════════════════
//  DOM helpers
// ═══════════════════════════════════════════
const $  = id => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; return e; };

// ═══════════════════════════════════════════
//  啟動
// ═══════════════════════════════════════════
sb.auth.onAuthStateChange((_e, session) => {
  user = session?.user ?? null;
  user ? loginUI(user) : logoutUI();
});

sb.auth.getSession().then(({ data: { session } }) => {
  user = session?.user ?? null;
  if (user) loginUI(user);
});

$('btn-login').onclick  = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: 'https://hu4110.github.io/writing-studio-supabase/' } });
$('btn-logout').onclick = () => sb.auth.signOut();
$('btn-new').onclick    = newNote;
$('btn-del').onclick    = () => noteId && delNote(noteId);
$('editor').oninput     = onInput;
$('t-title').oninput    = onInput;
$('t-font').onchange    = e => $('editor').style.fontFamily = e.target.value;
$('t-size').onchange    = e => $('editor').style.fontSize   = e.target.value;

// ═══════════════════════════════════════════
//  登入 / 登出 UI
// ═══════════════════════════════════════════
async function loginUI(u) {
  $('login').style.display = 'none';
  $('avatar').src = u.user_metadata?.avatar_url || '';
  $('avatar').style.display = '';
  $('uname').textContent = u.user_metadata?.full_name || u.email;
  $('uname').style.display = '';
  $('btn-logout').style.display = '';
  setBadge('ok');
  await loadNotes();
  startRealtime();
}

function logoutUI() {
  $('login').style.display = 'flex';
  $('avatar').style.display = 'none';
  $('uname').style.display  = 'none';
  $('btn-logout').style.display = 'none';
  setBadge('off');
  if (channel) { sb.removeChannel(channel); channel = null; }
  notes = {}; noteId = null;
  renderList(); showEmpty();
}

// ═══════════════════════════════════════════
//  讀取筆記
// ═══════════════════════════════════════════
async function loadNotes() {
  const { data, error } = await sb
    .from('notes')
    .select('id, title, updated_at')
    .order('updated_at', { ascending: false });

  if (error) { console.error('loadNotes', error); setBadge('off'); return; }
  notes = {};
  (data || []).forEach(n => notes[n.id] = n);
  renderList();
}

// ═══════════════════════════════════════════
//  即時同步
// ═══════════════════════════════════════════
function startRealtime() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('notes')
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'notes', filter: `user_id=eq.${user.id}` },
      async ({ eventType, new: nw, old: ol }) => {
        if (eventType === 'DELETE') {
          delete notes[ol.id];
          if (noteId === ol.id) showEmpty();
        } else {
          notes[nw.id] = nw;
          // 若目前開著這則筆記 且 不是自己剛儲存 → 從雲端刷新內容
          if (noteId === nw.id && !timer) {
            const { data } = await sb.from('notes').select('title,body').eq('id', nw.id).single();
            if (data) {
              remote = true;
              $('t-title').value = data.title || '';
              $('editor').innerHTML = data.body || '';
              $('s-sync').textContent = '已從其他裝置同步 ✓';
              remote = false;
            }
          }
        }
        renderList();
      }
    )
    .subscribe();
}

// ═══════════════════════════════════════════
//  新增筆記
// ═══════════════════════════════════════════
async function newNote() {
  if (!user) return;
  const { data, error } = await sb
    .from('notes')
    .insert({ user_id: user.id, title: '新筆記', body: '' })
    .select()
    .single();

  if (error) { alert('建立失敗：' + error.message); console.error(error); return; }
  notes[data.id] = data;
  renderList();
  openNote(data.id);
}

// ═══════════════════════════════════════════
//  刪除筆記
// ═══════════════════════════════════════════
async function delNote(id) {
  if (!confirm('確定刪除這則筆記？')) return;
  const { error } = await sb.from('notes').delete().eq('id', id);
  if (error) { alert('刪除失敗：' + error.message); return; }
  delete notes[id];
  if (noteId === id) showEmpty();
  renderList();
}

// ═══════════════════════════════════════════
//  開啟筆記
// ═══════════════════════════════════════════
async function openNote(id) {
  noteId = id;
  const { data, error } = await sb.from('notes').select('*').eq('id', id).single();
  if (error) { console.error(error); return; }

  $('empty').style.display = 'none';
  $('panel').style.display = 'flex';
  $('t-title').value    = data.title || '';
  $('editor').innerHTML = data.body  || '';
  $('s-sync').textContent = '已載入 ✓';
  updateStats();
  renderList();
}

function showEmpty() {
  noteId = null;
  $('empty').style.display = 'flex';
  $('panel').style.display = 'none';
}

// ═══════════════════════════════════════════
//  渲染側欄列表
// ═══════════════════════════════════════════
function renderList() {
  const lst = $('list');
  lst.innerHTML = '';
  const arr = Object.values(notes).sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
  if (!arr.length) {
    const d = el('div'); d.style.cssText = 'padding:14px;font-size:.8rem;color:var(--muted);text-align:center';
    d.textContent = '尚無筆記'; lst.appendChild(d); return;
  }
  arr.forEach(n => {
    const d = el('div', 'ni' + (n.id === noteId ? ' active' : ''));
    const ts = new Date(n.updated_at).toLocaleString('zh-TW', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
    d.innerHTML = `
      <div class="ni-info">
        <div class="ni-title">${esc(n.title || '（無標題）')}</div>
        <div class="ni-date">${ts}</div>
      </div>
      <button class="ni-del" data-id="${n.id}">✕</button>`;
    d.addEventListener('click', e => {
      if (e.target.classList.contains('ni-del')) { delNote(e.target.dataset.id); return; }
      openNote(n.id);
    });
    lst.appendChild(d);
  });
}

// ═══════════════════════════════════════════
//  輸入 → debounce 儲存
// ═══════════════════════════════════════════
function onInput() {
  if (remote) return;
  setBadge('ing');
  $('s-sync').textContent = '儲存中...';
  updateStats();
  clearTimeout(timer);
  timer = setTimeout(save, 1500);
}

async function save() {
  timer = null;
  if (!noteId || !user) return;
  const title = $('t-title').value.trim() || '（無標題）';
  const body  = $('editor').innerHTML;
  const now   = new Date().toISOString();

  const { error } = await sb.from('notes')
    .update({ title, body, updated_at: now })
    .eq('id', noteId);

  if (error) {
    console.error('save', error);
    setBadge('off'); $('s-sync').textContent = '儲存失敗 ✗';
  } else {
    if (notes[noteId]) { notes[noteId].title = title; notes[noteId].updated_at = now; }
    setBadge('ok');
    $('s-sync').textContent = '已儲存 ✓ ' + new Date().toLocaleTimeString('zh-TW');
    renderList();
  }
}

// ═══════════════════════════════════════════
//  工具函式
// ═══════════════════════════════════════════
function updateStats() {
  const t = $('editor').innerText || '';
  $('s-chars').textContent = t.replace(/\s/g,'').length + ' 字';
  $('s-paras').textContent = t.split(/\n+/).filter(l=>l.trim()).length + ' 段落';
}

function setBadge(state) {
  const b = $('badge');
  b.className = 'badge ' + state;
  b.querySelector('.dot').className = 'dot' + (state==='ing'?' pulse':'');
  b.querySelector('span').textContent = { ok:'已同步', ing:'同步中', off:'未連線' }[state];
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
