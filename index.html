<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寫作工作室</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── Theme Variables ── */
[data-theme="light"] {
  --bg:          #F9F8F6;
  --sidebar-bg:  #FFFFFF;
  --paper:       #FFFFFF;
  --border:      #EEECE8;
  --text:        #1C1C1E;
  --text-muted:  #8E8E93;
  --text-faint:  #C7C7CC;
  --hover:       #F5F4F1;
  --active-bg:   #1C1C1E;
  --active-text: #FFFFFF;
  --accent:      #A07850;
  --danger:      #FF3B30;
  --success:     #34C759;
  --warning:     #FF9500;
  --shadow:      0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.04);
  --shadow-paper:0 2px 8px rgba(0,0,0,.04), 0 16px 48px rgba(0,0,0,.06);
  --nav-bg:      rgba(249,248,246,.85);
}
[data-theme="dark"] {
  --bg:          #161614;
  --sidebar-bg:  #1E1E1C;
  --paper:       #242422;
  --border:      #2E2E2C;
  --text:        #F2F2F0;
  --text-muted:  #888884;
  --text-faint:  #444440;
  --hover:       #2A2A28;
  --active-bg:   #F2F2F0;
  --active-text: #1C1C1E;
  --accent:      #C49A6C;
  --danger:      #FF453A;
  --success:     #30D158;
  --warning:     #FFD60A;
  --shadow:      0 1px 3px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.2);
  --shadow-paper:0 2px 8px rgba(0,0,0,.3), 0 16px 48px rgba(0,0,0,.25);
  --nav-bg:      rgba(22,22,20,.85);
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
html, body { height: 100%; }
body {
  font-family: 'Inter', 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  overflow: hidden;
  transition: background .3s, color .3s;
}

/* ── Login ── */
#login {
  position: fixed; inset: 0; z-index: 2000;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  transition: background .3s;
}
.login-card {
  background: var(--paper); border-radius: 28px;
  padding: 52px 48px 44px;
  box-shadow: var(--shadow-paper);
  text-align: center; max-width: 400px; width: 90%;
  border: 1px solid var(--border);
}
.login-brand { font-size: .75rem; font-weight: 600; letter-spacing: .18em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 24px; }
.login-card h1 { font-family: 'Lora', 'Noto Serif TC', serif; font-size: 2rem; font-weight: 600; letter-spacing: -.03em; margin-bottom: 10px; }
.login-card p { color: var(--text-muted); font-size: .9rem; line-height: 1.6; margin-bottom: 36px; }
.btn-google {
  background: var(--text); color: var(--bg);
  border: none; padding: 13px 24px; border-radius: 14px;
  font-weight: 500; font-size: .9rem; font-family: inherit;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; cursor: pointer; transition: opacity .2s, transform .2s;
}
.btn-google:hover { opacity: .85; transform: translateY(-1px); }
.btn-google svg { width: 18px; height: 18px; flex-shrink: 0; }

/* ── Layout ── */
aside {
  width: 280px; flex-shrink: 0;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  height: 100vh; overflow: hidden;
  transition: width .35s cubic-bezier(.4,0,.2,1), transform .35s cubic-bezier(.4,0,.2,1), background .3s, border-color .3s;
  z-index: 50;
}
aside.focus-hide { width: 0; border-right: none; overflow: hidden; }

main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; min-width: 0; }

/* ── Sidebar header ── */
.sb-top {
  padding: 20px 16px 12px;
  border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 12px;
  flex-shrink: 0;
  transition: border-color .3s;
}
.sb-title-row { display: flex; align-items: center; justify-content: space-between; }
.sb-title { font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
.sb-actions { display: flex; gap: 4px; }
.icon-btn {
  width: 28px; height: 28px; border-radius: 8px; border: none; cursor: pointer;
  background: transparent; color: var(--text-muted);
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s; font-size: .85rem;
}
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn.active { background: var(--text); color: var(--bg); }

/* Search */
.sb-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--hover); border-radius: 10px; padding: 7px 12px;
  border: 1px solid transparent; transition: border-color .15s;
}
.sb-search:focus-within { border-color: var(--accent); }
.sb-search svg { width: 14px; height: 14px; color: var(--text-muted); flex-shrink: 0; }
.sb-search input { border: none; outline: none; background: transparent; font-size: .82rem; font-family: inherit; color: var(--text); width: 100%; }
.sb-search input::placeholder { color: var(--text-faint); }

/* Note list */
#list { flex: 1; overflow-y: auto; padding: 8px; }
#list::-webkit-scrollbar { width: 4px; }
#list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.note-item {
  padding: 12px 14px; border-radius: 14px; cursor: pointer;
  margin-bottom: 3px; transition: background .15s; position: relative;
  border: 1px solid transparent;
}
.note-item:hover { background: var(--hover); }
.note-item.active { background: var(--active-bg); border-color: transparent; }
.note-item.active .ni-title,
.note-item.active .ni-preview { color: var(--active-text); }
.note-item.active .ni-date { color: rgba(255,255,255,.5); }
[data-theme="dark"] .note-item.active .ni-date { color: rgba(28,28,30,.5); }
.ni-title { font-size: .88rem; font-weight: 500; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); transition: color .15s; }
.ni-preview { font-size: .75rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; transition: color .15s; line-height: 1.4; }
.ni-date { font-size: .7rem; color: var(--text-faint); transition: color .15s; }
.ni-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--warning); margin-right: 4px; vertical-align: middle; opacity: 0; transition: opacity .2s; }
.note-item.unsaved .ni-dot { opacity: 1; }
.ni-del {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  opacity: 0; background: none; border: none; color: var(--danger);
  cursor: pointer; padding: 6px; border-radius: 6px; font-size: .8rem;
  transition: opacity .15s, background .15s;
}
.note-item:hover .ni-del { opacity: 1; }
.ni-del:hover { background: rgba(255,59,48,.12); }

/* Sidebar footer */
.sb-footer {
  padding: 14px 16px; border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0; transition: border-color .3s;
}
.user-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
.user-avatar-placeholder { width: 30px; height: 30px; border-radius: 50%; background: var(--hover); flex-shrink: 0; }
.user-name { font-size: .82rem; font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logout-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; border-radius: 6px; font-size: .8rem; transition: color .15s; font-family: inherit; }
.logout-btn:hover { color: var(--danger); }

/* ── Nav bar ── */
nav {
  height: 56px; padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--nav-bg); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; gap: 12px;
  transition: background .3s, border-color .3s;
  position: relative; z-index: 10;
}
.nav-left { display: flex; align-items: center; gap: 10px; }
.nav-right { display: flex; align-items: center; gap: 6px; }
.status-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 20px; font-size: .72rem; font-weight: 500;
  background: var(--hover); color: var(--text-muted); border: 1px solid var(--border);
  transition: all .3s;
}
.status-chip.online { color: var(--success); }
.status-chip.syncing { color: var(--warning); }
.sdot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.sdot.pulse { animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }

/* ── Editor wrapper ── */
.editor-scroll { flex: 1; overflow-y: auto; display: flex; justify-content: center; padding: 32px 24px 80px; background: var(--bg); transition: background .3s; }
.editor-scroll::-webkit-scrollbar { width: 6px; }
.editor-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

/* Paper card */
.paper {
  width: 100%; max-width: 740px;
  background: var(--paper);
  border-radius: 28px;
  box-shadow: var(--shadow-paper);
  border: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: background .3s, border-color .3s, box-shadow .3s;
  min-height: calc(100vh - 160px);
}

/* Paper toolbar */
.paper-toolbar {
  padding: 16px 28px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap; flex-shrink: 0;
  transition: border-color .3s;
}
.tool-group { display: flex; align-items: center; gap: 4px; }
.tool-sep { width: 1px; height: 18px; background: var(--border); }
.tool-select {
  border: none; outline: none; background: transparent;
  font-size: .78rem; color: var(--text-muted); font-family: inherit;
  cursor: pointer; padding: 3px 4px; border-radius: 6px; transition: color .15s, background .15s;
  appearance: none;
}
.tool-select:hover { color: var(--text); background: var(--hover); }
.tool-label { font-size: .72rem; color: var(--text-faint); }
.del-btn-paper {
  margin-left: auto; background: none; border: none; cursor: pointer;
  color: var(--text-faint); font-size: .78rem; font-family: inherit;
  padding: 4px 8px; border-radius: 6px;
  display: flex; align-items: center; gap: 5px; transition: color .15s, background .15s;
}
.del-btn-paper:hover { color: var(--danger); background: rgba(255,59,48,.08); }

/* Title input */
#title-input {
  width: 100%; border: none; outline: none; background: transparent;
  font-family: 'Lora', 'Noto Serif TC', serif;
  font-size: 1.9rem; font-weight: 600; color: var(--text);
  padding: 28px 32px 16px;
  letter-spacing: -.02em; line-height: 1.3;
  transition: color .3s;
}
#title-input::placeholder { color: var(--text-faint); }

/* Editor */
#editor {
  flex: 1; padding: 8px 32px 40px; outline: none;
  font-family: 'Lora', 'Noto Serif TC', serif;
  font-size: 1.05rem; line-height: 1.95; color: var(--text);
  transition: color .3s, font-family .2s;
  min-height: 280px;
}
#editor:empty::before { content: "在此開始書寫您的故事…"; color: var(--text-faint); }

/* Bottom bar */
.bottom-bar {
  padding: 10px 28px; border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px;
  font-size: .72rem; color: var(--text-faint); flex-shrink: 0;
  transition: border-color .3s;
}
.bottom-bar span { display: flex; align-items: center; gap: 5px; }

/* ── Empty state ── */
#empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--text-faint); text-align: center; gap: 12px;
  padding: 40px;
}
#empty-state svg { width: 56px; height: 56px; opacity: .15; }
#empty-state p { font-size: .88rem; line-height: 1.6; }

/* ── Focus mode overlay ── */
#focus-overlay {
  display: none; position: fixed; inset: 0; z-index: 5;
}
body.focus-mode #focus-overlay { display: block; }

/* ── Theme toggle ── */
.theme-toggle { position: relative; }

/* ── Mobile ── */
#mob-menu-btn { display: none; }
@media (max-width: 768px) {
  #mob-menu-btn { display: flex; }
  aside {
    position: fixed; left: 0; top: 0; bottom: 0;
    transform: translateX(-100%); width: 280px !important;
    transition: transform .3s cubic-bezier(.4,0,.2,1) !important;
    box-shadow: 4px 0 24px rgba(0,0,0,.12);
  }
  aside.mob-open { transform: translateX(0); }
  .editor-scroll { padding: 16px 12px 80px; }
  #title-input { font-size: 1.4rem; padding: 20px 20px 12px; }
  #editor { padding: 8px 20px 32px; }
  .paper-toolbar { padding: 12px 20px; }
  .bottom-bar { padding: 8px 20px; }
}
</style>
</head>
<body>

<!-- Login -->
<div id="login">
  <div class="login-card">
    <div class="login-brand">Writing Studio</div>
    <h1>寫作工作室</h1>
    <p>為追求極致純粹的書寫體驗而生<br>登入後筆記自動同步雲端</p>
    <button class="btn-google" id="btn-login">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.8 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.1 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.9 7.2l7.6 5.9c4.4-4.1 7.1-10.1 7.1-17.1z"/><path fill="#FBBC05" d="M10.5 28.6A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.6-5.9c-2 1.4-4.7 2.2-7.6 2.2-6.2 0-11.5-4.2-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
      使用 Google 帳號開始
    </button>
  </div>
</div>

<!-- Sidebar -->
<aside id="sidebar">
  <div class="sb-top">
    <div class="sb-title-row">
      <span class="sb-title">我的筆記</span>
      <div class="sb-actions">
        <button class="icon-btn" id="btn-new" title="新增筆記">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="搜尋筆記…">

</aside>

<!-- Main -->
<main>
  <nav>
    <div class="nav-left">
      <button class="icon-btn" id="mob-menu-btn" title="選單">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="status-chip offline" id="status-chip">

      </button>
    </div>
  </nav>

  <!-- Empty state -->

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    <p>選擇一則筆記<br>或點擊「+」開始新篇章</p>

    <div class="paper" id="paper">

        <div class="tool-group">
          <span class="tool-label">字體</span>

          <span class="tool-label">字級</span>

            <option value=".95rem">緊湊</option>
            <option value="1.05rem" selected>舒適</option>

      <!-- Body -->
      <div id="editor" contenteditable="true" spellcheck="false"></div>

      <!-- Bottom bar -->
      <div class="bottom-bar">
        <span>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span id="char-count">0 字</span>

        <span>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg>
          <span id="para-count">0 段落</span>

        <span id="save-info" style="margin-left:auto"></span>
      </div>
    </div>
  </div>
</main>

<script>

const SITE_URL = 'https://hu4110.github.io/writing-studio-supabase/';
const sb = supabase.createClient(SB_URL, SB_KEY);

let user = null, noteId = null, notes = {}, saveTimer = null;
let realtimeChannel = null, isMobSidebarOpen = false, isFocusMode = false;
const $ = id => document.getElementById(id);

// ── Theme ──────────────────────────────────────────────────
const savedTheme = localStorage.getItem('theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);
updateThemeIcon(savedTheme);

function updateThemeIcon(theme) {
  $('icon-sun').style.display  = theme === 'dark'  ? 'block' : 'none';
  $('icon-moon').style.display = theme === 'light' ? 'block' : 'none';
}
$('btn-theme').onclick = () => {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeIcon(next);
};

// ── Focus mode ─────────────────────────────────────────────
$('btn-focus').onclick = () => {
  isFocusMode = !isFocusMode;
  $('sidebar').classList.toggle('focus-hide', isFocusMode);
  $('btn-focus').classList.toggle('active', isFocusMode);
};

// ── Auth ───────────────────────────────────────────────────
sb.auth.getSession().then(({ data: { session } }) => {
  if (session?.user) { user = session.user; onLogin(user); }
});
sb.auth.onAuthStateChange((_e, session) => {
  user = session?.user ?? null;
  user ? onLogin(user) : onLogout();
});

$('btn-login').onclick  = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: SITE_URL } });
$('btn-logout').onclick = () => sb.auth.signOut();

async function onLogin(u) {
  $('login').style.display = 'none';
  const meta = u.user_metadata;
  if (meta?.avatar_url) {
    $('user-avatar').src = meta.avatar_url;
    $('user-avatar').style.display = 'block';
    $('avatar-placeholder').style.display = 'none';
  }
  $('user-name').textContent = meta?.full_name || meta?.name || u.email;
  $('btn-logout').style.display = 'block';
  setStatus('online');
  await loadNotes();
  setupRealtime();
}

function onLogout() {
  $('login').style.display = 'flex';
  $('user-avatar').style.display = 'none';
  $('avatar-placeholder').style.display = 'block';
  $('user-name').textContent = '未登入';
  $('btn-logout').style.display = 'none';
  setStatus('offline');
  if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
  notes = {}; noteId = null;
  renderList(); showEmpty();
}

// ── Notes ──────────────────────────────────────────────────
async function loadNotes() {
  const { data, error } = await sb.from('notes').select('id,title,body,updated_at').order('updated_at', { ascending: false });
  if (error) { console.error(error); return; }
  notes = {};
  data.forEach(n => notes[n.id] = n);
  renderList();
}

function setupRealtime() {
  if (realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb.channel('notes-rt')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'notes' }, ({ eventType, new: nw, old: ol }) => {
      if (nw?.user_id && nw.user_id !== user?.id) return;
      if (eventType === 'DELETE') {
        delete notes[ol.id];
        if (noteId === ol.id) showEmpty();
      } else { notes[nw.id] = nw; }
      renderList();
    }).subscribe();
}

async function newNote() {
  if (!user) return;
  const { data, error } = await sb.from('notes').insert({ user_id: user.id, title: '', body: '' }).select().single();
  if (error) { alert('建立失敗：' + error.message); return; }
  notes[data.id] = data;
  renderList(); openNote(data.id);
  if (window.innerWidth <= 768) closeMobSidebar();
}

async function openNote(id) {
  noteId = id;
  const { data, error } = await sb.from('notes').select('*').eq('id', id).single();
  if (error) { console.error(error); return; }
  showEditor();
  $('title-input').value = data.title || '';
  $('editor').innerHTML  = data.body  || '';
  updateStats(); renderList();
  $('save-info').textContent = '';
}

async function delNote(id) {
  if (!confirm('確定要永久刪除這則筆記嗎？')) return;
  const { error } = await sb.from('notes').delete().eq('id', id);
  if (error) { alert('刪除失敗：' + error.message); return; }
  delete notes[id];
  if (noteId === id) showEmpty();
  renderList();
}

// ── Save ───────────────────────────────────────────────────
function onInput() {
  setStatus('syncing');
  markUnsaved();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNote, 1200);
  updateStats();
}

async function saveNote() {
  if (!noteId || !user) return;
  const title = $('title-input').value.trim();
  const body  = $('editor').innerHTML;
  const now   = new Date().toISOString();
  const { error } = await sb.from('notes').update({ title, body, updated_at: now }).eq('id', noteId);
  if (error) { setStatus('offline'); return; }
  if (notes[noteId]) { notes[noteId].title = title; notes[noteId].body = body; notes[noteId].updated_at = now; }
  setStatus('online');
  markSaved();
  $('save-info').textContent = '已儲存 ' + new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' });
  renderList();
}

function markUnsaved() { const el = document.querySelector(`.note-item[data-id="${noteId}"]`); if (el) el.classList.add('unsaved'); }
function markSaved()   { const el = document.querySelector(`.note-item[data-id="${noteId}"]`); if (el) el.classList.remove('unsaved'); }

// ── Render ─────────────────────────────────────────────────
let searchQuery = '';
$('search-input').oninput = e => { searchQuery = e.target.value.toLowerCase(); renderList(); };

function renderList() {
  const list = $('list');
  list.innerHTML = '';
  let arr = Object.values(notes).sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
  if (searchQuery) arr = arr.filter(n => (n.title||'').toLowerCase().includes(searchQuery) || (n.body||'').toLowerCase().includes(searchQuery));
  if (!arr.length) {
    list.innerHTML = `<div style="padding:20px 16px;font-size:.8rem;color:var(--text-faint);text-align:center">${searchQuery ? '找不到符合的筆記' : '尚無筆記'}</div>`;
    return;
  }
  arr.forEach(n => {
    const div = document.createElement('div');
    div.className = 'note-item' + (n.id === noteId ? ' active' : '');
    div.dataset.id = n.id;
    const preview = (n.body || '').replace(/<[^>]+>/g, '').slice(0, 60) || '（尚無內容）';
    const date = new Date(n.updated_at).toLocaleDateString('zh-TW', { month:'numeric', day:'numeric' });
    div.innerHTML = `
      <div class="ni-title"><span class="ni-dot"></span>${esc(n.title || '無標題筆記')}</div>
      <div class="ni-preview">${esc(preview)}</div>
      <div class="ni-date">${date}</div>
      <button class="ni-del" data-id="${n.id}" title="刪除">✕</button>`;
    div.onclick = e => {
      if (e.target.classList.contains('ni-del') || e.target.dataset.id) { delNote(e.target.dataset.id || n.id); return; }
      openNote(n.id);
      if (window.innerWidth <= 768) closeMobSidebar();
    };
    list.appendChild(div);
  });
}

// ── UI helpers ─────────────────────────────────────────────
function showEditor() {
  $('empty-state').style.display = 'none';
  $('editor-scroll').style.display = 'flex';
}
function showEmpty() {
  noteId = null;
  $('empty-state').style.display = 'flex';
  $('editor-scroll').style.display = 'none';
  renderList();
}

function setStatus(state) {
  const chip = $('status-chip'), dot = $('sdot'), txt = $('status-text');
  chip.className = 'status-chip ' + state;
  dot.className  = 'sdot' + (state === 'syncing' ? ' pulse' : '');
  txt.textContent = { online:'已同步至雲端', syncing:'同步中…', offline:'未連線' }[state];
}

function updateStats() {
  const t = $('editor').innerText || '';
  $('char-count').textContent = t.replace(/\s/g,'').length + ' 字';
  $('para-count').textContent = t.split(/\n+/).filter(p=>p.trim()).length + ' 段落';
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Font & size ────────────────────────────────────────────
const FONTS = {
  serif: "'Lora','Noto Serif TC',serif",
  sans:  "'Inter','Noto Sans TC',sans-serif"
};
$('font-select').onchange = e => { $('editor').style.fontFamily = FONTS[e.target.value]; };
$('size-select').onchange = e => { $('editor').style.fontSize   = e.target.value; };

// ── Mobile sidebar ─────────────────────────────────────────
$('mob-menu-btn').onclick = () => {
  isMobSidebarOpen = !isMobSidebarOpen;
  $('sidebar').classList.toggle('mob-open', isMobSidebarOpen);
};
function closeMobSidebar() {
  isMobSidebarOpen = false;
  $('sidebar').classList.remove('mob-open');
}

// ── Bindings ───────────────────────────────────────────────
$('btn-new').onclick      = newNote;
$('btn-del').onclick      = () => noteId && delNote(noteId);
$('title-input').oninput  = onInput;
$('editor').oninput       = onInput;
</script>
</body>
</html>
