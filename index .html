    #login { position: fixed; inset: 0; z-index: 1000; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; }
    .login-card { background: white; padding: 3rem; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); text-align: center; max-width: 400px; width: 90%; }
    .login-card h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.75rem; letter-spacing: -0.02em; }

    .btn-google:hover { background: #333; transform: translateY(-1px); }

    #list { flex: 1; overflow-y: auto; padding: 0 12px 20px; }

    .note-item:hover { background: var(--hover-color); }
    .note-item.active { background: var(--active-bg); border-color: var(--border-color); }
    .note-item .title { font-size: 0.95rem; font-weight: 500; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .note-item .btn-del-small { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); opacity: 0; background: none; border: none; color: var(--danger); padding: 8px; transition: opacity 0.2s; cursor: pointer; }

    main { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }

    .nav-left { display: flex; align-items: center; gap: 16px; }
    #btn-menu-toggle { display: none; background: none; border: none; font-size: 1.25rem; cursor: pointer; }
    .status-pill { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: white; border-radius: 20px; font-size: 0.75rem; font-weight: 500; box-shadow: 0 2px 8px rgba(0,0,0,0.02); border: 1px solid var(--border-color); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #ccc; }
    .status-dot.syncing { background: #f5a623; animation: pulse 1s infinite; }
    .status-dot.online { background: var(--success); }
    .user-profile { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }

    #btn-logout:hover { color: var(--danger); }

    .editor-wrapper { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 40px 24px 100px; }

    #title-input { width: 100%; border: none; outline: none; background: transparent; font-size: 2.25rem; font-weight: 700; margin-bottom: 24px; font-family: var(--font-sans); letter-spacing: -0.03em; }
    #title-input::placeholder { color: #e5e5e5; }
    .editor-tools { display: flex; gap: 16px; margin-bottom: 32px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); align-items: center; }
    .editor-tools select { background: none; border: none; font-size: 0.8rem; color: var(--text-muted); outline: none; cursor: pointer; font-family: inherit; }
    .editor-tools select:hover { color: var(--accent-color); }
    #editor { width: 100%; min-height: 50vh; outline: none; font-size: 1.15rem; line-height: 1.8; color: var(--text-main); font-family: var(--font-sans); }
    #editor:empty::before { content: "在此開始書寫您的故事..."; color: #ccc; }

    .empty-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--text-muted); pointer-events: none; }
    .empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.1; }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    @media (max-width: 768px) {
        #btn-menu-toggle { display: block; }
        aside { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
        aside.open { transform: translateX(0); }
        .editor-wrapper { padding-top: 20px; }
        #title-input { font-size: 1.75rem; }
        .bottom-info { bottom: 12px; left: 12px; right: 12px; justify-content: center; }
    }
</style>

</main>

<script>
    const SB_URL  = 'https://cxaaydhcrrlwfhpsylfr.supabase.co';
    const SB_KEY  = 'sb_publishable_wowWxuYTrvWRlayPcAcbVQ_2peC_l6s';
    const SITE_URL = 'https://hu4110.github.io/writing-studio-supabase/';

    const sb = supabase.createClient(SB_URL, SB_KEY);

    let user = null, noteId = null, notes = {}, saveTimer = null;
    let realtimeChannel = null, isSidebarOpen = false;

    const $ = id => document.getElementById(id);

    // ── FIX Bug4: 主動檢查現有 session ──
    sb.auth.getSession().then(({ data: { session } }) => {
        if (session?.user) { user = session.user; updateUIWithUser(user); }
    });

    sb.auth.onAuthStateChange((_e, session) => {
        user = session?.user ?? null;
        user ? updateUIWithUser(user) : showLogin();
    });

    function showLogin() {
        $('login').style.display = 'flex';
        $('avatar').style.display = 'none';
        $('btn-logout').style.display = 'none';
        setStatus('offline');
        // FIX Bug3: 登出時清除 realtime 頻道
        if (realtimeChannel) { sb.removeChannel(realtimeChannel); realtimeChannel = null; }
        notes = {}; noteId = null;
        renderList(); showEmpty();
    }

    async function updateUIWithUser(u) {
        $('login').style.display = 'none';
        $('avatar').src = u.user_metadata?.avatar_url || '';
        $('avatar').style.display = 'block';
        $('btn-logout').style.display = 'block';
        setStatus('online');
        await loadNotes();
        setupRealtime();
    }

    async function loadNotes() {
        const { data, error } = await sb
            .from('notes').select('id, title, updated_at')
            .order('updated_at', { ascending: false });
        if (error) { console.error('loadNotes', error); return; }
        notes = {};
        data.forEach(n => notes[n.id] = n);
        renderList();
    }

    // ── FIX Bug2 & Bug3: 移除 filter，改為手動過濾；追蹤頻道 ──
    function setupRealtime() {
        if (realtimeChannel) sb.removeChannel(realtimeChannel);
        realtimeChannel = sb.channel('db-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'notes' }, payload => {
                const { eventType, new: nw, old: ol } = payload;
                if (nw?.user_id && nw.user_id !== user?.id) return;
                if (eventType === 'DELETE' && ol?.user_id && ol.user_id !== user?.id) return;
                if (eventType === 'DELETE') {
                    delete notes[ol.id];
                    if (noteId === ol.id) showEmpty();
                } else {
                    notes[nw.id] = nw;
                }
                renderList();
            }).subscribe();
    }

    async function newNote() {
        if (!user) return;
        const { data, error } = await sb
            .from('notes').insert({ user_id: user.id, title: '', body: '' })
            .select().single();
        // FIX Bug5: 失敗時顯示錯誤
        if (error) { alert('建立筆記失敗：' + error.message); console.error(error); return; }
        notes[data.id] = data;
        renderList();
        openNote(data.id);
        if (window.innerWidth <= 768) toggleSidebar();
    }

    async function openNote(id) {
        noteId = id;
        const { data, error } = await sb.from('notes').select('*').eq('id', id).single();
        if (error) { console.error('openNote', error); return; }
        $('empty-state').style.display = 'none';
        $('editor-wrapper').style.display = 'flex';
        $('bottom-info').style.display = 'flex';
        $('title-input').value = data.title || '';
        $('editor').innerHTML = data.body || '';
        updateStats();
        renderList();
    }

    function showEmpty() {
        noteId = null;
        $('empty-state').style.display = 'flex';
        $('editor-wrapper').style.display = 'none';
        $('bottom-info').style.display = 'none';
    }

    async function delNote(id) {
        if (!confirm('確定要永久刪除這則筆記嗎？')) return;
        const { error } = await sb.from('notes').delete().eq('id', id);
        if (error) { alert('刪除失敗：' + error.message); return; }
        delete notes[id];
        if (noteId === id) showEmpty();
        renderList();
    }

    function onInput() {
        setStatus('syncing');
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveNote, 1000);
        updateStats();
    }

    async function saveNote() {
        if (!noteId || !user) return;
        const title = $('title-input').value.trim();
        const body  = $('editor').innerHTML;
        const now   = new Date().toISOString();
        const { error } = await sb.from('notes')
            .update({ title, body, updated_at: now }).eq('id', noteId);
        if (error) { console.error('saveNote', error); setStatus('offline'); return; }
        if (notes[noteId]) { notes[noteId].title = title; notes[noteId].updated_at = now; }
        setStatus('online');
        $('save-time').textContent = '已儲存於 ' + new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
        renderList();
    }

    function setStatus(state) {
        const dot = $('status-dot'), text = $('status-text');
        if (state === 'syncing') { dot.className = 'status-dot syncing'; text.textContent = '雲端同步中...'; }
        else if (state === 'online') { dot.className = 'status-dot online'; text.textContent = '已與雲端同步'; }
        else { dot.className = 'status-dot'; text.textContent = '未連線'; }
    }

    function updateStats() {
        const text = $('editor').innerText || '';
        $('char-count').textContent = text.replace(/\s/g, '').length + ' 字';
        $('para-count').textContent = text.split(/\n+/).filter(p => p.trim()).length + ' 段落';
    }

    function renderList() {
        const list = $('list');
        list.innerHTML = '';
        const sorted = Object.values(notes).sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));
        if (!sorted.length) {
            list.innerHTML = '<div style="padding:16px;font-size:.8rem;color:var(--text-muted);text-align:center">尚無筆記</div>';
            return;
        }
        sorted.forEach(n => {
            const item = document.createElement('div');
            item.className = 'note-item' + (n.id === noteId ? ' active' : '');
            item.innerHTML = `
                <div class="title">${n.title || '無標題筆記'}</div>
                <div class="meta">${new Date(n.updated_at).toLocaleDateString('zh-TW')}</div>
                <button class="btn-del-small">✕</button>`;
            item.onclick = e => {
                if (e.target.classList.contains('btn-del-small')) { delNote(n.id); return; }
                openNote(n.id);
                if (window.innerWidth <= 768) toggleSidebar();
            };
            list.appendChild(item);
        });
    }

    function toggleSidebar() {
        isSidebarOpen = !isSidebarOpen;
        $('sidebar').classList.toggle('open', isSidebarOpen);
    }

    // ── FIX Bug1: 使用固定 redirectTo ──
    $('btn-login').onclick    = () => sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: SITE_URL } });
    $('btn-logout').onclick   = () => sb.auth.signOut();
    $('btn-new').onclick      = newNote;
    $('btn-del-main').onclick = () => noteId && delNote(noteId);
    $('title-input').oninput  = onInput;
    $('editor').oninput       = onInput;
    $('font-select').onchange = e => $('editor').style.fontFamily = e.target.value;
    $('size-select').onchange = e => $('editor').style.fontSize   = e.target.value;
    $('btn-menu-toggle').onclick = toggleSidebar;
</script>

</body>
